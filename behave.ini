# Behave BDD Framework Configuration
# Replaces Maven Surefire plugin and CukesRunner.java @CucumberOptions configuration
# Equivalent to: pom.xml maven-surefire-plugin + CukesRunner.java settings

[behave]
# Feature Files Location
# Java equivalent: features = "src/main/resources/features" (CukesRunner.java line 15)
paths = features/

# Step Definitions Location (automatic discovery in features/steps/)
# Java equivalent: glue = "com/testinium/step_definitions" (CukesRunner.java line 16)
# Note: Behave automatically discovers step definitions in features/steps/ directory

# Output Formats
# Java equivalent: plugin = {"html:...", "json:...", "rerun:...", "me.jvt.cucumber.report.PrettyReports:..."}
# Supports multiple formatters for comprehensive reporting
format = 
    json
    html
    pretty
    allure_behave.formatter:AllureFormatter
    junit

# Output File Paths
# Java equivalent: 
#   - "html:target/cucumber-reports.html" → reports/behave-reports/report.html
#   - "json:target/cucumber.json" → reports/behave-reports/cucumber.json
outfiles = 
    reports/behave-reports/cucumber.json
    reports/behave-reports/report.html

# JUnit XML Report for CI/CD Integration (Jenkins, Azure DevOps, etc.)
# Enables Jenkins test result publishing and trend analysis
junit = true
junit_directory = reports/junit

# Display Configuration
# show_skipped: Hide skipped scenarios in output
# show_timings: Display execution time for each scenario and step
show_skipped = false
show_timings = true

# Capture Configuration
# stdout_capture: Set to false for debugging (see print statements)
# stderr_capture: Set to false for debugging (see error output)
# log_capture: Capture Python logging output
stdout_capture = false
stderr_capture = false
log_capture = true

# Logging Configuration
# Controls Python logging level for test execution
logging_level = INFO
logging_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
logging_datefmt = %Y-%m-%d %H:%M:%S

# Default Tags for Test Execution
# Java equivalent: tags = "@Smoke" (CukesRunner.java line 18)
# Can be overridden via command line: behave --tags=@Login
tags = @Smoke

# Dry Run Configuration
# Java equivalent: dryRun = false (CukesRunner.java line 17)
# Set to true to validate step definitions without executing tests
# dry_run = false

# Color Output
# Enable colorized terminal output for better readability
color = true

# Summary Configuration
# Display detailed summary after test execution
summary = true

# Allure Reporting Configuration
# Allure results directory for enhanced HTML reporting
# Run: allure serve reports/allure-results
# Java equivalent: "me.jvt.cucumber.report.PrettyReports:target/cucumber"
[behave.userdata]
allure_results_dir = reports/allure-results

# Screenshot Configuration
# Screenshots captured on failure via environment.py after_scenario hook
screenshot_dir = reports/screenshots

# Rerun Failed Tests Configuration
# Java equivalent: FailedTestRunner.java reads target/rerun.txt
# Behave supports rerun format natively
# Usage: behave @reports/rerun.txt
rerun_file = reports/rerun.txt

# ============================================================================
# PARALLEL EXECUTION DOCUMENTATION
# ============================================================================
# Java equivalent: maven-surefire-plugin configuration
#   - <parallel>methods</parallel>
#   - <useUnlimitedThreads>true</useUnlimitedThreads>
#
# Python Behave Parallel Execution Options:
#
# Option 1: behave-parallel (pip install behave-parallel)
#   Command: behave --processes 4 --parallel-element scenario
#   - Scenario-level parallelism
#   - Good for independent test scenarios
#
# Option 2: pytest-bdd with pytest-xdist (pip install pytest-bdd pytest-xdist)
#   Command: pytest -n auto --dist loadscope
#   - More flexible parallelism control
#   - Better reporting and test discovery
#   - Recommended for large test suites
#
# Option 3: GNU Parallel with Behave
#   Command: parallel behave --tags={} ::: @Login @Logout @Calendar @Contact
#   - Tag-based parallel execution
#   - Good for feature-level parallelism
#
# Thread Safety Requirements:
#   - WebDriver instances must use threading.local() (see utilities/driver_manager.py)
#   - Behave context object is thread-safe by default
#   - Ensure page objects do not share mutable state
#
# To enable parallel execution, uncomment and configure:
# [behave.parallel]
# processes = 4
# parallel_element = scenario
# ============================================================================

# ============================================================================
# EXECUTION EXAMPLES
# ============================================================================
# Run all tests with default @Smoke tag:
#   behave
#
# Run specific feature file:
#   behave features/Login.feature
#
# Run with specific tags:
#   behave --tags=@Login
#   behave --tags=@Login,@Logout      # OR condition
#   behave --tags=@Smoke --tags=@SalesManager  # AND condition
#   behave --tags='not @WIP'          # Exclude WIP tests
#
# Run with custom format:
#   behave --format=json --outfile=custom-report.json
#
# Run specific scenario by line number:
#   behave features/Login.feature:10
#
# Dry run (validate step definitions):
#   behave --dry-run
#
# Rerun failed tests:
#   behave @reports/rerun.txt
#
# Generate Allure report:
#   behave --format=allure_behave.formatter:AllureFormatter
#   allure serve reports/allure-results
#
# Verbose output with step details:
#   behave --verbose --no-capture
#
# Run with custom user data:
#   behave -D browser=firefox -D headless=true
# ============================================================================

# ============================================================================
# CI/CD INTEGRATION
# ============================================================================
# Jenkins Integration:
#   1. Execute: behave --junit --junit-directory reports/junit
#   2. Publish JUnit test results: reports/junit/*.xml
#   3. Archive HTML reports: reports/behave-reports/
#   4. Archive screenshots: reports/screenshots/
#
# Jira Integration:
#   - Feature tags support Jira ticket references: @UPGN-286, @UPGN-287
#   - Use Xray or Zephyr plugins to sync test results
#
# Azure DevOps Integration:
#   - Publish test results using JUnit XML: reports/junit/*.xml
#   - Publish code coverage using pytest-cov (if applicable)
# ============================================================================

# ============================================================================
# CONFIGURATION OVERRIDE PRECEDENCE
# ============================================================================
# 1. Command-line arguments (highest priority)
# 2. Environment variables (BEHAVE_*)
# 3. behave.ini configuration file
# 4. Default Behave settings (lowest priority)
#
# Example environment variable override:
#   export BEHAVE_TAGS="@Login"
#   export BEHAVE_FORMAT="json"
# ============================================================================
