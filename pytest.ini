# pytest.ini
# Pytest configuration file for optional pytest-bdd integration
# Complements Behave framework for comprehensive Python testing
# Part of Java Selenium + Cucumber to Python Selenium + Behave migration

[pytest]
# Minimum pytest version required
minversion = 7.0

# Test discovery paths - where pytest should look for tests
testpaths = tests

# Test file patterns - which files pytest should consider as test files
python_files = test_*.py *_test.py

# Test class patterns - which classes pytest should consider as test classes
python_classes = Test*

# Test function patterns - which functions pytest should consider as test functions
python_functions = test_*

# Additional command-line options for pytest execution
# -ra: Show summary info for all test outcomes (passed, failed, skipped, etc.)
# -q: Quiet mode, less verbose output
# --strict-markers: Raise error on unknown markers (prevents typos)
# --tb=short: Short traceback format for failures
# -v: Verbose output showing individual test names
# -n auto: Enable parallel execution with pytest-xdist (auto-detect CPU count)
addopts = 
    -ra
    -q
    --strict-markers
    --tb=short
    -v
    -n auto

# Console output style
console_output_style = progress

# Enable live logging to console during test execution
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# File logging configuration
log_file = logs/pytest_execution.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# JUnit XML report configuration for CI/CD integration (Jenkins, etc.)
junit_family = xunit2
junit_suite_name = Testinium QA Python Test Suite

# Test markers - define custom markers for test categorization and selective execution
# These markers correspond to the test modules migrated from Java Cucumber tags
markers =
    smoke: Smoke test cases for critical functionality
    regression: Comprehensive regression test suite
    login: Login functionality tests (@Login tag equivalent)
    logout: Logout functionality tests (@Logout tag equivalent)
    calendar: Calendar module tests
    contact: Contact management tests
    crm: CRM module tests
    employee: Employee management tests
    inventory: Inventory management tests
    notes: Notes module tests
    sales: Sales module tests
    session: Session management tests
    sales_manager: Tests requiring Sales Manager role (@SalesManager tag equivalent)
    pos_manager: Tests requiring POS Manager role (@PosManager tag equivalent)
    slow: Tests that take significant time to execute
    fast: Quick-running tests suitable for pre-commit hooks
    integration: Integration tests requiring external dependencies
    unit: Unit tests for framework components
    wip: Work in progress tests (excluded from default runs)

# Filter warnings during test execution
# Suppress specific deprecation warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*urllib3.*:DeprecationWarning
    ignore:.*selenium.*:DeprecationWarning

# Coverage configuration (optional, for code coverage reporting)
# Uncomment and configure if using pytest-cov plugin
# [coverage:run]
# source = pages,utilities,features/steps
# omit = 
#     */tests/*
#     */venv/*
#     */__pycache__/*
# 
# [coverage:report]
# precision = 2
# show_missing = True
# skip_covered = False
# 
# [coverage:html]
# directory = reports/coverage_html

# pytest-xdist configuration for parallel execution
# Distributed testing across multiple CPUs
# -n auto: Automatically detect number of CPUs
# -n NUM: Use NUM worker processes
# --dist loadscope: Group tests by module for better resource sharing
# --maxfail=1: Stop after first failure (useful for debugging)

# Timeout configuration (if using pytest-timeout plugin)
# timeout = 300
# timeout_method = thread

# Test execution order (if using pytest-randomly plugin)
# randomly_seed = 12345
# randomly_dont_shuffle_modules = True

# Doctest configuration (if testing docstrings)
# doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS

# Cache configuration
# cache_dir = .pytest_cache

# Assertion configuration for better error messages
# python_paths = .

# Environment variables for test execution (alternative to .env file)
# Can be set here but better to use python-dotenv
# Environment variables should be managed via .env file or CI/CD secrets
