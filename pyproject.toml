[tool.poetry]
name = "testinium-qa-python"
version = "1.0.0"
description = "Python Selenium + Behave BDD test automation framework migrated from Java"
authors = ["Testinium QA Team <qa@testinium.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/testinium/testinium-qa-python"
repository = "https://github.com/testinium/testinium-qa-python"
keywords = ["selenium", "behave", "bdd", "test-automation", "qa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
python = "^3.9"
# Core Testing Framework - BDD and Test Execution
selenium = "^4.15.2"
behave = "^1.2.6"
pytest = "^7.4.3"
pytest-bdd = "^6.1.1"

# WebDriver Management
webdriver-manager = "^4.0.1"

# Test Data Generation
Faker = "^20.1.0"

# Configuration Management
python-dotenv = "^1.0.0"
PyYAML = "^6.0.1"

# Reporting and Visualization
allure-behave = "^2.13.2"
allure-pytest = "^2.13.2"
pytest-html = "^4.1.1"
behave-html-formatter = "^0.9.10"

# Parallel Execution
pytest-xdist = "^3.5.0"

# HTTP Utilities
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
# Code Quality and Linting
pylint = "^3.0.3"
black = "^23.12.1"
mypy = "^1.7.1"

# Testing Coverage
pytest-cov = "^4.1.0"

# Additional Development Tools
isort = "^5.13.0"
flake8 = "^7.0.0"
bandit = "^1.7.5"
safety = "^2.3.5"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--color=yes",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "smoke: Smoke tests that verify critical functionality",
    "regression: Comprehensive regression test suite",
    "slow: Tests that take a long time to execute",
    "integration: Integration tests",
    "unit: Unit tests",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
  | venv
)/
'''

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "selenium.*",
    "behave.*",
    "allure.*",
    "faker.*",
]
ignore_missing_imports = true

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [
    "venv/*",
    ".venv/*",
    "build/*",
    "dist/*",
    "*.egg-info/*",
]

[tool.pylint.main]
max-line-length = 100
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
    "W0212",  # protected-access
]
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "driver"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
max-line-length = 100

[tool.coverage.run]
source = ["pages", "utilities", "config"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B601"]

[tool.poetry.scripts]
# Optional: Define custom command-line scripts here
test = "pytest:main"
