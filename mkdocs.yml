# ==============================================================================
# Build Configuration
# ==============================================================================
# Directories
docs_dir: docs
site_dir: site

# Strict mode - fail build on warnings (recommended for CI/CD)
strict: true

# Validation settings
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn

# Watch additional files for changes during development
watch:
  - includes

# Use directory URLs (e.g., /page/ instead of /page.html)
use_directory_urls: true

# ==============================================================================
# Development Server Configuration
# ==============================================================================
dev_addr: 127.0.0.1:8000

# ==============================================================================
# Build Optimization
# ==============================================================================
# Exclude patterns
exclude_docs: |
  *.tmp
  *.swp
  *~
  .DS_Store
  .git/
  .gitignore

# ==============================================================================
# Hooks (if custom build hooks are needed)
# ==============================================================================
# hooks:
#   - hooks/on_page_markdown.py

# ==============================================================================
# End of Configuration
# ==============================================================================

