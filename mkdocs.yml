# MkDocs Configuration for Testinium QA - Python Test Automation Framework
# This configuration file defines the complete documentation structure for the
# Selenium + Behave BDD test automation framework migrated from Java to Python.
#
# Documentation Coverage:
# - 105+ documentation files organized hierarchically
# - API reference for all packages (config, utilities, pages, steps)
# - User guides for all features and framework extension
# - Architecture documentation with Mermaid diagrams
# - Deployment guides for multiple environments
# - Troubleshooting and contributing guides
#
# Source: Agent Action Plan Section 0.5, 0.6, 0.9

# ==============================================================================
# Site Metadata
# ==============================================================================
site_name: 'Testinium QA - Python Test Automation Framework'
site_description: 'Comprehensive documentation for Python Selenium + Behave BDD test automation framework with Page Object Model, parallel execution support, and extensive reporting capabilities'
site_author: 'Testinium QA Team'
site_url: 'https://testinium.github.io/testinium-qa-python/'
repo_url: 'https://github.com/testinium/testinium-qa-python'
repo_name: 'testinium/testinium-qa-python'
copyright: 'Copyright &copy; 2024 Testinium QA Team'
edit_uri: 'edit/main/docs/'

# ==============================================================================
# Theme Configuration - Material Design
# ==============================================================================
theme:
  name: material
  language: en
  
  # Color Palette with Light/Dark Mode Toggle
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  # Typography
  font:
    text: Roboto
    code: Roboto Mono
  
  # Theme Features
  features:
    - navigation.tabs              # Top-level navigation tabs
    - navigation.tabs.sticky       # Sticky navigation tabs
    - navigation.sections          # Navigation sections
    - navigation.expand            # Expand navigation by default
    - navigation.path              # Breadcrumb navigation
    - navigation.indexes           # Section index pages
    - navigation.top               # Back to top button
    - navigation.footer            # Footer navigation
    - toc.follow                   # TOC follows scroll
    - toc.integrate                # Integrate TOC into navigation
    - search.suggest               # Search suggestions
    - search.highlight             # Highlight search terms
    - search.share                 # Share search results
    - content.code.copy            # Copy code button
    - content.code.annotate        # Code annotations
    - content.tabs.link            # Link content tabs
  
  # Logo and Favicon
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  
  # Custom 404 page
  static_templates:
    - 404.html

