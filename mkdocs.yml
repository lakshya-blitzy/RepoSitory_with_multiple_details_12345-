# ==============================================================================
# Plugins Configuration
# ==============================================================================
plugins:
  # Built-in Search Plugin
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
      prebuild_index: true
  
  # mkdocstrings - Auto-generate API documentation from Python docstrings
  - mkdocstrings:
      enabled: true
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            # Display options
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            
            # Documentation structure
            heading_level: 2
            show_bases: true
            show_inheritance_diagram: false
            
            # Docstring parsing
            docstring_style: google
            docstring_section_style: table
            merge_init_into_class: true
            show_if_no_docstring: false
            
            # Signature rendering
            show_signature: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 80
            
            # Member filtering
            filters:
              - "!^_"  # Exclude private members by default
            members_order: source
            group_by_category: true
            
            # Additional features
            show_submodules: true
  
  # Mermaid2 - Render Mermaid diagrams for architecture visualization
  - mermaid2:
      version: 10.6.1
      arguments:
        theme: |
          ^(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'
  
  # Minify - Optimize HTML, CSS, and JS for faster loading
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
        remove_empty_space: true
      cache_safe: true
  
  # Git Revision Date - Show last update dates for documentation currency
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
      enabled: true

# ==============================================================================
# Markdown Extensions
# ==============================================================================
markdown_extensions:
  # Python Markdown Extensions
  - abbr                           # Abbreviation support
  - admonition                     # Note/warning/tip boxes
  - attr_list                      # Add HTML attributes to elements
  - def_list                       # Definition lists
  - footnotes                      # Footnote support
  - md_in_html                     # Markdown inside HTML
  - tables                         # Table support
  - toc:                           # Table of contents
      permalink: true
      permalink_title: Anchor link to this section
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      toc_depth: 3
  
  # PyMdown Extensions for Enhanced Functionality
  - pymdownx.arithmatex:           # Math notation support
      generic: true
  
  - pymdownx.betterem:             # Better emphasis (bold/italic)
      smart_enable: all
  
  - pymdownx.caret                 # Superscript and insert support
  - pymdownx.mark                  # Highlight/mark text
  - pymdownx.tilde                 # Subscript and delete support
  
  - pymdownx.critic:               # Critic markup for change tracking
      mode: view
  
  - pymdownx.details               # Collapsible admonitions
  
  - pymdownx.emoji:                # Emoji support
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  
  - pymdownx.highlight:            # Syntax highlighting for code blocks
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      auto_title: false
      linenums: false
      linenums_style: pymdownx-inline
  
  - pymdownx.inlinehilite          # Inline code highlighting
  
  - pymdownx.keys                  # Keyboard key styling
  
  - pymdownx.magiclink:            # Auto-link URLs and repository references
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: testinium
      repo: testinium-qa-python
  
  - pymdownx.smartsymbols          # Smart symbols (copyright, arrows, etc.)
  
  - pymdownx.snippets:             # Include external files/snippets
      auto_append:
        - includes/abbreviations.md
      check_paths: true
  
  - pymdownx.superfences:          # Enhanced fenced code blocks
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  
  - pymdownx.tabbed:               # Tabbed content blocks
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  
  - pymdownx.tasklist:             # Task lists with checkboxes
      custom_checkbox: true
      clickable_checkbox: false

# ==============================================================================
# Extra Configuration
# ==============================================================================
extra:
  # Social Links
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/testinium/testinium-qa-python
      name: Testinium QA Python on GitHub
    - icon: fontawesome/brands/python
      link: https://www.python.org
      name: Python Official Website
    - icon: fontawesome/solid/book
      link: https://testinium.github.io/testinium-qa-python/
      name: Documentation
  
  # Version Information
  version:
    provider: mike
    default: latest
  
  # Analytics (placeholder - add Google Analytics ID when available)
  analytics:
    provider: google
    property: G-XXXXXXXXXX  # Replace with actual Google Analytics ID
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve by
            <a href="https://github.com/testinium/testinium-qa-python/issues/new/?title=[Feedback]+{title}+-+{url}" target="_blank" rel="noopener">opening an issue</a>.
  
  # Consent for analytics (GDPR compliance)
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
    actions:
      - accept
      - reject
      - manage

